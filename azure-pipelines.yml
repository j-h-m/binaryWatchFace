# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '17' # Ensure Java version matches your AGP requirements
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

# 1. Clear any cached build artifacts that might contain old .dex files
- script: |
    cd AndroidStudioProject
    chmod +x gradlew
    ./gradlew clean
  displayName: 'Grant execute permission and clean project'

# 2. Build the App bundle (AAB) or APK without running unit tests
- task: Gradle@3
  inputs:
    gradleWrapperFile: './AndroidStudioProject/gradlew'
    tasks: ':watchface:bundleRelease' # Use assembleRelease if you want APKs
  displayName: 'Build Resource-Only Watch Face'

